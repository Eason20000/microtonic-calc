[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "microtonic-calc"
version = "0.1.0"
description = "n-EDO Scale Tune SysEx parameter calculator for MIDI devices"
requires-python = ">=3.14"
license = "GPL-3.0-only"
license-files = ["LICEN[CS]E*"]
readme = "README.md"
dependencies = [
    "tabulate>=0.10.0",
]

[project.scripts]
mtcalc = "microtonic_calc.main:main"
